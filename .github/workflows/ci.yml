name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Typecheck, Lint, Tests & Bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Legal pages up to date
        run: npm run legal:check

      - name: Unit tests
        run: npm test -- --ci

      - name: Bundle for iOS, Android and Web
        run: npx expo export --platform ios --platform android --platform web --output-dir dist
